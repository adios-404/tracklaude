name: Release

# Pushing a tag `vX.Y.Z` publishes a GitHub Release carrying `tracklaude-vX.Y.Z.zip` and
# its `.sha256`, built by this public workflow from the tagged source (spec story 38;
# ADR-0002: no auto-update, so this plus Homebrew is the whole update channel).
on:
  push:
    tags: ['v*']

# Only what `gh release create` needs. The token is the runner's own; no long-lived key
# lives in this repository's secrets — releases are ad-hoc signed on purpose (ticket 10).
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # The bundle's version comes from the VERSION file, so the tag must say the same
      # thing or the Release would carry an app whose Info.plist contradicts its name.
      - name: Tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file_version); bump VERSION first." >&2
            exit 1
          fi

      - name: Test
        run: make test

      # One `sign` feeds both: the trust checks (log redaction, hostname allowlist,
      # entitlements — the README's promises) and the archive. A release cannot ship
      # what CI would refuse.
      - name: Build, sign, trust checks, zip
        run: make trust zip

      - name: Info.plist version equals the tag
        run: |
          plist_version="$(plutil -extract CFBundleShortVersionString raw dist/tracklaude.app/Contents/Info.plist)"
          [ "v$plist_version" = "$GITHUB_REF_NAME" ] || { echo "Info.plist says $plist_version, tag is $GITHUB_REF_NAME" >&2; exit 1; }

      - name: Verify the archive round-trips
        run: |
          cd dist
          shasum -a 256 -c "tracklaude-$GITHUB_REF_NAME.zip.sha256"
          mkdir roundtrip && ditto -x -k "tracklaude-$GITHUB_REF_NAME.zip" roundtrip
          codesign --verify --verbose=2 roundtrip/tracklaude.app

      # A tag with a hyphen (`v0.0.1-test`, `v1.0.0-rc1`) is marked pre-release so
      # "latest" keeps pointing at a real version.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # `--notes` is prepended to the generated notes: the run that built this
          # Release and the hash, so a reader can verify without leaving the page, and
          # the first-launch interruptions, so nobody mistakes them for a bad download.
          notes="Built by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`.

          SHA-256: \`$(cut -d' ' -f1 "dist/tracklaude-$GITHUB_REF_NAME.zip.sha256")\` — see README › Verify a release.

          **First launch of this version:** macOS blocks it once until you approve it (macOS 15 and later: *Open Anyway* in System Settings → Privacy & Security; macOS 14: Control-click → Open), and the Keychain asks for your login password twice. Both are expected for an ad-hoc signed app — see [README › Install]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#install)."
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease \
            --notes "$notes" \
            "dist/tracklaude-$GITHUB_REF_NAME.zip" \
            "dist/tracklaude-$GITHUB_REF_NAME.zip.sha256"

  # Opens a pull request against adios-404/homebrew-tap bumping the cask to this tag's
  # version and hash (ticket 11). A separate job so a tap failure can be re-run without
  # re-publishing the Release, and so the tap token never shares a step with the build.
  # A pull request, not a push: the tap's own CI audits the change, and merging it is the
  # moment `brew upgrade` sees the new version. Pre-releases never reach the tap.
  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The hash comes from the published Release, not a rebuild: the cask must name
      # exactly the bytes users download.
      - name: Read the published hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "tracklaude-$GITHUB_REF_NAME.zip.sha256" --dir release
          echo "SHA256=$(cut -d' ' -f1 "release/tracklaude-$GITHUB_REF_NAME.zip.sha256")" >> "$GITHUB_ENV"

      # TAP_GITHUB_TOKEN: a fine-grained token limited to adios-404/homebrew-tap with
      # Contents and Pull requests read/write — nothing on this repository.
      - name: Open the tap pull request
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "TAP_GITHUB_TOKEN secret is not set; see ticket 11." >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          branch="tracklaude-$version"
          gh auth setup-git
          git clone --depth 1 https://github.com/adios-404/homebrew-tap.git tap
          sh Scripts/bump-cask.sh "$version" "$SHA256" tap/Casks/tracklaude.rb
          cd tap
          if git diff --quiet; then
            echo "Cask already at $version with this hash; nothing to open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "tracklaude $version"
          # Why --force: a re-run after a failed PR step must replace its own branch.
          git push --force origin "$branch"
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$branch" --title "tracklaude $version" --body "Bumps the cask to [$GITHUB_REF_NAME]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME).

          SHA-256 \`$SHA256\`, read from the Release's \`.sha256\` asset by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Merging publishes the update to \`brew upgrade\`."
          else
            echo "An open pull request for $branch already exists; its branch was updated."
          fi
