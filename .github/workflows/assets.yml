name: Compile Assets.car

# Run by hand after `make icon` changes Packaging/AppIcon.icns. The runner has Xcode, whose
# actool is the only tool that writes an asset catalog; the owner's Mac has just the
# Command Line Tools. Download the artefact and commit it as Packaging/Assets.car:
#   gh run download <run-id> -n Assets.car -D Packaging
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Compile
        run: sh Scripts/compile-assets.sh

      - name: Show what the catalog holds
        run: xcrun assetutil --info Packaging/Assets.car

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Assets.car
          path: Packaging/Assets.car
          retention-days: 7
          if-no-files-found: error
