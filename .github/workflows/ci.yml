name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Swift Testing needs a Swift 6 toolchain (Xcode 16+); the runner's default may be older.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # Architecture rule from the spec: the core library holds logic only.
      - name: TracklaudeCore imports no UI framework
        run: "! grep -rnE '^import (AppKit|SwiftUI|Cocoa)' Sources/TracklaudeCore"

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Smoke-test the packaging path so a broken Makefile fails CI, not a release.
      - name: Bundle and sign
        run: make sign

      # Trust guarantees (ticket 09): the README's promises, enforced. Each script is
      # runnable locally and was verified to fail when its property is broken.
      - name: Every log call goes through the redactor
        run: sh Scripts/check-log-redaction.sh

      - name: Release binary names no host outside the allowlist
        run: sh Scripts/check-hostnames.sh .build/release/tracklaude

      - name: Signed app carries exactly app-sandbox, network.client, network.server
        run: sh Scripts/check-entitlements.sh dist/tracklaude.app
