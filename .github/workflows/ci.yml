name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Swift Testing needs a Swift 6 toolchain (Xcode 16+); the runner's default may be older.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # Architecture rule from the spec: the core library holds logic only.
      - name: TracklaudeCore imports no UI framework
        run: "! grep -rnE '^import (AppKit|SwiftUI|Cocoa)' Sources/TracklaudeCore"

      - name: Build
        run: make build

      - name: Test
        run: make test

      # Smoke-test the packaging path so a broken Makefile fails CI, not a release.
      - name: Bundle and sign
        run: make sign

      - name: Verify entitlements are exactly app-sandbox, network.client, network.server
        run: |
          codesign -d --entitlements :- dist/tracklaude.app 2>/dev/null \
            | grep -o 'com\.apple\.security[a-z.-]*' | sort > actual.txt
          printf 'com.apple.security.app-sandbox\ncom.apple.security.network.client\ncom.apple.security.network.server\n' > expected.txt
          diff expected.txt actual.txt
