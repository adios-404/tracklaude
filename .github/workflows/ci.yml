name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Swift Testing needs a Swift 6 toolchain (Xcode 16+); the runner's default may be older.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      # Architecture rule from the spec: the core library holds logic only.
      - name: TracklaudeCore imports no UI framework
        run: "! grep -rnE '^import (AppKit|SwiftUI|Cocoa)' Sources/TracklaudeCore"

      - name: Build
        run: make build

      - name: Test
        run: make test

      # The release workflow's packaging path, exercised on every push so a broken
      # Makefile fails CI rather than a tagged release. One `sign` feeds both the trust
      # checks (ticket 09: the README's promises, enforced by the three Scripts/check-*.sh
      # scripts, each verified to fail when its property is broken) and the archive.
      - name: Bundle, sign, trust checks, zip
        run: make trust zip

      # The build this toolchain produced, downloadable for a week. Why: it is not the
      # build a local toolchain produces — the CI-built v0.0.1-test crashed on launch
      # where the local build ran (Swift 6.0 vs 6.2 isolation checks, 2026-09-17) — so a
      # launch check on a Mac must use this artefact, not `make install`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tracklaude-${{ github.sha }}
          path: dist/tracklaude-v*.zip*
          retention-days: 7
          if-no-files-found: error
